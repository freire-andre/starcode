<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" role="img" aria-labelledby="title desc">
  <title id="title">StarCode: da ideia à entrega</title>
  <desc id="desc">Fluxograma do StarCode, com criação opcional de projeto, classificação da missão, especificação, implementação, verificação, revisão e retrospectiva, seguido dos ganhos e papéis da tripulação.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#172442"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#80a9e8"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#eef4ff}.title{font-size:48px;font-weight:750;letter-spacing:1px}.sub{font-size:20px;fill:#b7c8e4}.section{font-size:22px;font-weight:700;letter-spacing:2px;fill:#8ebcff}.name{font-size:23px;font-weight:700}.body{font-size:17px;fill:#d0dcef}.small{font-size:15px;fill:#b5c7df}.tag{font-size:14px;font-weight:700;fill:#081729}.box{fill:#172741;stroke:#41628f;stroke-width:1.5}.accent{fill:#1e3554;stroke:#72aaf1;stroke-width:2}.optional{fill:#242d46;stroke:#9984d2;stroke-width:1.5}.gate{fill:#443729;stroke:#e4b763;stroke-width:1.5}.line{fill:none;stroke:#80a9e8;stroke-width:2.5;marker-end:url(#arrow)}.thin{fill:none;stroke:#7695bf;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1800" fill="url(#bg)"/>
  <circle cx="1440" cy="110" r="220" fill="#527fc1" opacity=".06"/><circle cx="140" cy="1450" r="260" fill="#8a68c8" opacity=".05"/>
  <text x="80" y="82" class="section">STARCODE  /  VISÃO DO PROCESSO</text>
  <text x="80" y="145" class="title">Da ideia à entrega, com a tripulação</text>
  <text x="80" y="181" class="sub">Desenvolvimento orientado por especificação, com decisões humanas e verificações em cada etapa.</text>
  <rect x="80" y="218" width="1440" height="4" rx="2" fill="#75a9ed" opacity=".65"/>

  <text x="80" y="268" class="section">01  /  PREPARAR A JORNADA</text>
  <rect x="80" y="288" width="430" height="122" rx="14" class="optional"/>
  <text x="102" y="320" class="name">Kirk · projeto do zero</text>
  <text x="102" y="349" class="body">Entende a stack, conduz a criação</text><text x="102" y="374" class="body">e faz o commit inicial. Entrada opcional.</text>
  <rect x="555" y="288" width="430" height="122" rx="14" class="optional"/>
  <text x="577" y="320" class="name">Scotty + Uhura · fundação</text>
  <text x="577" y="349" class="body">Scotty aplica o perfil e os gates;</text><text x="577" y="374" class="body">Uhura prepara a documentação da stack.</text>
  <rect x="1030" y="288" width="490" height="122" rx="14" class="box"/>
  <text x="1052" y="320" class="name">Setup · preparar o repositório</text>
  <text x="1052" y="349" class="body">Configura a integração com o Linear,</text><text x="1052" y="374" class="body">os estados e as labels do projeto.</text>
  <path d="M510 349 H550 M985 349 H1025" class="line"/>
  <text x="82" y="438" class="small">Projeto existente? Comece pelo setup e engaje uma missão; Kirk e a criação da fundação são opcionais.</text>
  <path d="M1275 410 V460 H800 V492" class="line"/>

  <text x="80" y="492" class="section">02  /  DEFINIR A MISSÃO</text>
  <rect x="440" y="510" width="720" height="100" rx="14" class="accent"/>
  <text x="465" y="545" class="name">Picard · coordena e classifica</text>
  <text x="465" y="576" class="body">Recebe a demanda, avalia tamanho e risco, escolhe o fluxo e acompanha a execução.</text>
  <path d="M800 610 V648" class="line"/>
  <rect x="80" y="660" width="430" height="145" rx="14" class="box"/>
  <text x="102" y="692" class="name">Pequena</text>
  <text x="102" y="721" class="body">LaForge implementa com checks</text><text x="102" y="746" class="body">definidos diretamente na missão.</text>
  <text x="102" y="782" class="small">Rota curta · até 5 passos</text>
  <rect x="555" y="660" width="430" height="145" rx="14" class="box"/>
  <text x="577" y="692" class="name">Média</text>
  <text x="577" y="721" class="body">Troi → Spock → aprovação</text><text x="577" y="746" class="body">→ LaForge, com checks da spec.</text>
  <text x="577" y="782" class="small">Descoberta e spec mais enxutas</text>
  <rect x="1030" y="660" width="490" height="145" rx="14" class="accent"/>
  <text x="1052" y="692" class="name">Grande ou complexa</text>
  <text x="1052" y="721" class="body">Percorre as etapas detalhadas abaixo,</text><text x="1052" y="746" class="body">com tarefas, provas e revisão.</text>
  <text x="1052" y="782" class="small">Fluxo completo ↓</text>
  <path d="M800 648 H295 V654 M800 648 H770 V654 M800 648 H1275 V654" class="thin"/>
  <path d="M1275 805 V850 H800 V877" class="line"/>

  <text x="80" y="880" class="section">03  /  FLUXO COMPLETO DE UMA FUNCIONALIDADE</text>
  <rect x="80" y="900" width="330" height="135" rx="14" class="box"/>
  <text x="100" y="932" class="name">1 · Troi</text><text x="100" y="961" class="body">Investiga necessidades,</text><text x="100" y="986" class="body">restrições e dúvidas.</text><text x="100" y="1016" class="small">Descoberta</text>
  <rect x="450" y="900" width="330" height="135" rx="14" class="box"/>
  <text x="470" y="932" class="name">2 · Spock</text><text x="470" y="961" class="body">Escreve a especificação</text><text x="470" y="986" class="body">e os critérios verificáveis.</text><text x="470" y="1016" class="small">Spec → aprovação humana</text>
  <rect x="820" y="900" width="330" height="135" rx="14" class="box"/>
  <text x="840" y="932" class="name">3 · Data</text><text x="840" y="961" class="body">Decompõe a spec em</text><text x="840" y="986" class="body">tarefas e tickets no Linear.</text><text x="840" y="1016" class="small">Plano → aprovação e publicação</text>
  <rect x="1190" y="900" width="330" height="135" rx="14" class="accent"/>
  <text x="1210" y="932" class="name">4 · LaForge</text><text x="1210" y="961" class="body">Implementa cada ticket</text><text x="1210" y="986" class="body">e executa seus testes.</text><text x="1210" y="1016" class="small">Tickets independentes: em paralelo</text>
  <path d="M410 968 H445 M780 968 H815 M1150 968 H1185" class="line"/>
  <path d="M1355 1035 V1063 H245 V1090" class="line"/>
  <rect x="80" y="1095" width="330" height="140" rx="14" class="box"/>
  <text x="100" y="1127" class="name">5 · Q</text><text x="100" y="1156" class="body">Verifica os requisitos e</text><text x="100" y="1181" class="body">contesta a força dos testes.</text><text x="100" y="1213" class="small">Verificação independente quando possível</text>
  <rect x="450" y="1095" width="330" height="140" rx="14" class="box"/>
  <text x="470" y="1127" class="name">6 · Guinan</text><text x="470" y="1156" class="body">Faz a retrospectiva e</text><text x="470" y="1181" class="body">registra as lições da missão.</text><text x="470" y="1213" class="small">Após os gates de conclusão</text>
  <rect x="820" y="1095" width="330" height="140" rx="14" class="box"/>
  <text x="840" y="1127" class="name">7 · Uhura</text><text x="840" y="1156" class="body">Redige a descrição do PR</text><text x="840" y="1181" class="body">e comentários para o Linear.</text><text x="840" y="1213" class="small">Comunicação para revisão</text>
  <rect x="1190" y="1095" width="330" height="140" rx="14" class="box"/>
  <text x="1210" y="1127" class="name">8 · Worf</text><text x="1210" y="1156" class="body">Revisa o PR, riscos e</text><text x="1210" y="1181" class="body">evidências antes do merge.</text><text x="1210" y="1213" class="small">Quando há fluxo com PR</text>
  <path d="M410 1165 H445 M780 1165 H815 M1150 1165 H1185" class="line"/>
  <rect x="80" y="1260" width="690" height="84" rx="12" class="optional"/>
  <text x="100" y="1292" class="name">McCoy · entra quando há bloqueio</text><text x="100" y="1320" class="body">Diagnostica falhas persistentes e ajuda a recuperar o fluxo.</text>
  <rect x="800" y="1260" width="720" height="84" rx="12" class="gate"/>
  <text x="820" y="1292" class="name">Você mantém o controle</text><text x="820" y="1320" class="body">Aprovações e ações Git seguem o modo escolhido; merge exige autorização.</text>

  <text x="80" y="1408" class="section">04  /  O QUE O STARCODE AJUDA A GANHAR</text>
  <rect x="80" y="1430" width="340" height="180" rx="14" class="box"/>
  <text x="102" y="1467" class="name">Mais clareza</text><text x="102" y="1500" class="body">Necessidades, decisões e</text><text x="102" y="1527" class="body">critérios ficam explícitos</text><text x="102" y="1554" class="body">antes da implementação.</text>
  <rect x="447" y="1430" width="340" height="180" rx="14" class="box"/>
  <text x="469" y="1467" class="name">Mais confiança</text><text x="469" y="1500" class="body">Checks, provas e revisão</text><text x="469" y="1527" class="body">ajudam a encontrar falhas</text><text x="469" y="1554" class="body">antes da entrega.</text>
  <rect x="814" y="1430" width="340" height="180" rx="14" class="box"/>
  <text x="836" y="1467" class="name">Mais rastreabilidade</text><text x="836" y="1500" class="body">Spec, tarefas e evidências</text><text x="836" y="1527" class="body">conectam o pedido ao</text><text x="836" y="1554" class="body">trabalho realizado.</text>
  <rect x="1181" y="1430" width="339" height="180" rx="14" class="box"/>
  <text x="1203" y="1467" class="name">Mais continuidade</text><text x="1203" y="1500" class="body">Papéis, estado e lições</text><text x="1203" y="1527" class="body">facilitam retomar o trabalho</text><text x="1203" y="1554" class="body">e evoluir o processo.</text>
  <text x="80" y="1674" class="small">O fluxo pode retornar à implementação para corrigir achados. McCoy, Kirk e Worf atuam conforme a necessidade e o modo escolhido.</text>
  <text x="80" y="1710" class="small">Base: README.md, skills/nova-missao e skills/engajar · StarCode v1.8.0</text>
  <text x="80" y="1750" class="small">Star Trek é marca de seus titulares; os nomes são usados como homenagem.</text>
</svg>
