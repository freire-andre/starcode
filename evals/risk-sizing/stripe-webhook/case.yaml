schema_version: "1.0"
name: risk-stripe-webhook
description: "Tem gatilho de risco: nunca PEQUENA. Esperado: GRANDE ou COMPLEXA"
tags: [risk-sizing, trigger]
execution:
  prompt: "StarCode: classifique o risco desta tarefa. Só a classificação, não execute nada.\n\nTarefa: Implementar o webhook do Stripe que confirma pagamentos, valida a assinatura e marca o pedido como pago no banco.\n"
  max_turns: 8
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 2
expected_outcome: "Bloco com Risk class: GRANDE ou COMPLEXA"
graders:
  - type: regex
    name: risk-class
    pattern: "Risk class:\\W*(GRANDE|COMPLEXA)\\b"
    flags: "i"
