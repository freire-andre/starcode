schema_version: "1.0"
name: risk-vague-performance
description: "Tem gatilho de risco: nunca PEQUENA. Esperado: MÉDIA ou GRANDE ou COMPLEXA"
tags: [risk-sizing, trigger]
execution:
  prompt: "StarCode: classifique o risco desta tarefa. Só a classificação, não execute nada.\n\nTarefa: Melhore a performance do app, ele está lento.\n"
  max_turns: 8
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 2
expected_outcome: "Bloco com Risk class: MÉDIA ou GRANDE ou COMPLEXA"
graders:
  - type: regex
    name: risk-class
    pattern: "Risk class:\\W*(M[ÉE]DIA|GRANDE|COMPLEXA)\\b"
    flags: "i"
