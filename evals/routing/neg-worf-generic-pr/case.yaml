schema_version: "1.0"
name: routing-neg-worf-generic-pr
description: "Não deve disparar starcode:worf (review de PR genérico fora do StarCode)."
tags: [routing, negative]
execution:
  prompt: "Revise o PR #42 e me diga o que acha."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 1
graders:
  - type: tool_used
    name: no-worf
    tool: Skill
    input_match: "starcode:worf"
    min: 0
    max: 0
