schema_version: "1.0"
name: routing-neg-unit-test
description: "Não deve disparar nenhuma skill do StarCode."
tags: [routing, negative]
execution:
  prompt: "Escreva um teste unitário para a função soma(a, b) em math_utils.py."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 1
graders:
  - type: tool_used
    name: no-starcode-skill
    tool: Skill
    input_match: "starcode:"
    min: 0
    max: 0
