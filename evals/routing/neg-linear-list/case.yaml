schema_version: "1.0"
name: routing-neg-linear-list
description: "Não deve disparar nenhuma skill do StarCode."
tags: [routing, negative]
execution:
  prompt: "Quais issues do Linear estão atribuídas a mim?"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 1
graders:
  - type: tool_used
    name: no-starcode-skill
    tool: Skill
    input_match: "starcode:"
    min: 0
    max: 0
