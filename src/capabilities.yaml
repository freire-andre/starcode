# StarCode capability matrix: extras per CLI (Fase 4, R1). Read by tools/build.py (tools/miniyaml.py subset).
# status: ok | unavailable. An unavailable extra MUST carry a fallback (build fails otherwise).
# build.py writes dist/<cli>/capabilities.json with only that CLI's extras.

schemaVersion: 1

claude:
  hooks:
    status: ok
  banner_hook:
    status: ok
  linear_mcp:
    status: ok
  subagent_model:
    status: ok
  orca_worker:
    status: ok

codex:
  hooks:
    status: ok
  banner_hook:
    status: ok
  linear_mcp:
    status: unavailable
    fallback: issue-mãe pelo orca linear
  subagent_model:
    status: unavailable
    fallback: Q por worker da Orca
  orca_worker:
    status: ok

antigravity:
  hooks:
    status: ok
  banner_hook:
    status: ok
  linear_mcp:
    status: unavailable
    fallback: issue-mãe pelo orca linear
  subagent_model:
    status: unavailable
    fallback: Q por worker da Orca
  orca_worker:
    status: ok

opencode:
  hooks:
    status: ok
  banner_hook:
    status: unavailable
    fallback: sem evento de início de sessão; o banner vem do engajar
  linear_mcp:
    status: unavailable
    fallback: issue-mãe pelo orca linear
  subagent_model:
    status: unavailable
    fallback: Q por worker da Orca
  orca_worker:
    status: ok
