# StarCode crew: single source for roles, invocation, default models and catchphrases.
# Read by tools/build.py (tools/miniyaml.py subset: no anchors, no multi-line strings).
# Default models follow PLANO_STARCODE.md section 3.2 (D17). The user config overrides only what differs.
# invocation: user = only the user calls it; model = the model may route to it; both = either.
# A crew member is emitted only when skills/<skill>/SKILL.md exists (build.py).

schemaVersion: 1

families:
  claude-opus-5-5: anthropic
  claude-sonnet-5-5: anthropic
  claude-haiku-5-5: anthropic
  gpt-6-luna: openai
  gemini-3.8-flash-high: google
  gemini-3.8-flash-medium: google
  gemini-3.8-flash-low: google

# Faixas de custo por modelo: grátis, $, $$ ou $$$. Mesma régua do scripts/model_info.py: preço de saída por
# 1M tokens no models.dev, $ < 2, $$ < 12, $$$ >= 12. Modelos fora desta lista recebem a faixa pelo catálogo.
costTiers:
  claude-opus-5-5: "$$$"
  claude-sonnet-5-5: "$$"
  claude-haiku-5-5: "$"
  gpt-6-luna: "$"
  gemini-3.8-flash-high: "$"
  gemini-3.8-flash-medium: "$"
  gemini-3.8-flash-low: "$"

crew:
