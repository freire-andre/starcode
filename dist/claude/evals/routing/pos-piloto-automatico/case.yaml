schema_version: "1.0"
name: routing-pos-piloto-automatico
description: "Deve disparar starcode:piloto-automatico e não starcode:engajar."
tags: [routing, positive]
execution:
  prompt: "StarCode, toque a feature de exportar CSV no piloto automático: me entreviste uma vez e decida o resto por mim."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 1
graders:
  - type: tool_used
    name: routes-to-piloto
    tool: Skill
    input_match: "starcode:piloto-automatico"
    min: 1
  - type: tool_used
    name: no-engajar
    tool: Skill
    input_match: "starcode:engajar"
    min: 0
    max: 0
