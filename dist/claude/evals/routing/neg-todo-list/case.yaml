schema_version: "1.0"
name: routing-neg-todo-list
description: "Não deve disparar nenhuma skill do StarCode."
tags: [routing, negative]
execution:
  prompt: "Monte uma lista de tarefas para eu organizar a mudança de apartamento no fim do mês."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 1
graders:
  - type: tool_used
    name: no-starcode-skill
    tool: Skill
    input_match: "starcode:"
    min: 0
    max: 0
